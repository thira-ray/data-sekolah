<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
  .row {
    display: grid;
    grid-template-columns: 120px 15px auto;
    align-items: start;
  }

  .label {
    white-space: nowrap;
  }

  .colon {
    text-align: center;
  }
</style>
 <h1>KERTAS PEPERIKSAAN</h1>

<div class="info">
  <div class="row">
    <span class="label">Mata Pelajaran</span>
    <span class="colon">:</span>
    <span>AL-QURAN</span>
  </div>

  <div class="row">
    <span class="label">Kod Kertas</span>
    <span class="colon">:</span>
    <span>UPKK01</span>
  </div>

  <br>

  <div class="row">
    <span class="label">No. Rujukan</span>
    <span class="colon">:</span>
    <span id="rujukan"></span>
  </div>

  <div class="row">
    <span class="label">Kod Pusat</span>
    <span class="colon">:</span>
    <span id="kod"></span>
  </div>

  <div class="row">
    <span class="label">Bekalan untuk</span>
    <span class="colon">:</span>
    <span id="sekolah"></span>
  </div>

  <br>

  <div class="row">
    <span class="label">Daerah</span>
    <span class="colon">:</span>
    <span id="daerah"></span>
  </div>

  <div class="row">
    <span class="label">Negeri</span>
    <span class="colon">:</span>
    <span id="negeri"></span>
  </div>
</div>

  <script src="schools.js?v=3"></script>
<script src="schools-east.js?v=2"></script>

<script>
const params = new URLSearchParams(window.location.search);
const kod = (params.get("kod") || "").trim();

if (window.SCHOOLS && window.SCHOOLS[kod]) {
  const data = window.SCHOOLS[kod];

  document.getElementById("rujukan").textContent = data.rujukan || "";
  document.getElementById("kod").textContent =
  kod.startsWith("SIMPANAN-") ? "" : kod;
  document.getElementById("sekolah").textContent = data.nama || "";
  document.getElementById("daerah").textContent = data.daerah || "";
  document.getElementById("negeri").textContent = data.negeri || "";
} else {
  document.getElementById("sekolah").textContent = "Kod sekolah tidak dijumpai";
}
</script>
